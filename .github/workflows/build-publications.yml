name: Build static publications

on:
  push:
    paths:
      - '_data/publications/**'
      - 'scripts/build_publications.py'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run publications build script
        run: python3 scripts/build_publications.py

      - name: Commit updated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Build: update static publications in index.html"
          git push
