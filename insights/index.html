<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Insights — Blue Door Architects</title>
<meta name="description" content="Design thinking, project stories and perspectives from Blue Door Architects — luxury architecture and interior design studio, Gandhinagar."/>
<link rel="canonical" href="https://bluedoorarchitects.com/insights/"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="icon" type="image/x-icon" href="/favicon.ico"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400&display=swap"/>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-LZEWCJRHDY"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-LZEWCJRHDY');gtag('config','AW-18244039331');</script>
<style>
:root{--gold:#c9a96e;--warm:#f5f0e8;--ink:#1a1a16;--mid:#6b6860;--ease:cubic-bezier(0.25,0.46,0.45,0.94)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--warm);color:var(--ink);font-family:'Jost',sans-serif;font-weight:300;min-height:100vh}
.ins-page-body{padding-top:80px;min-height:80vh}
.ins-page-header{padding:4rem 2.5rem 2rem;max-width:1400px;margin:0 auto}
.ins-page-header h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(2.5rem,5vw,4rem);letter-spacing:0.02em;line-height:1.1;margin-bottom:0.75rem}
.ins-page-header p{font-size:0.85rem;color:var(--mid);letter-spacing:0.04em;line-height:1.7;max-width:480px}
.ins-divider{width:40px;height:0.5px;background:var(--gold);margin:1.25rem 0}
.ins-grid-page{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:2rem;padding:2rem 2.5rem 6rem;max-width:1400px;margin:0 auto}
.ins-card{text-decoration:none;color:var(--ink);display:block;transition:opacity 0.2s}
.ins-card:hover{opacity:0.75}
.ins-cover{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#e8e3db}
.ins-card-body{padding:1.25rem 0 2rem}
.ins-meta{font-size:0.68rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--mid);margin-bottom:0.6rem}
.ins-title{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:1.35rem;line-height:1.3;margin-bottom:0.6rem}
.ins-excerpt{font-size:0.8rem;line-height:1.75;color:var(--mid);margin-bottom:0.75rem}
.ins-read{font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold)}
.ins-loading{text-align:center;padding:6rem;font-size:0.85rem;color:var(--mid);letter-spacing:0.08em;grid-column:1/-1}
@media(max-width:768px){
  .ins-page-header{padding:3rem 1.25rem 1.5rem}
  .ins-grid-page{grid-template-columns:1fr;padding:1.5rem 1.25rem 4rem}
}
</style>
</head>
<body>
<div class="ins-page-body">
  <div class="ins-page-header">
    <p style="font-size:0.68rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--mid);margin-bottom:1.25rem">Blue Door Architects</p>
    <h1>Insights</h1>
    <div class="ins-divider"></div>
    <p>Design thinking, project stories and perspectives from our studio in Gandhinagar.</p>
  </div>
  <div class="ins-grid-page" id="insights-grid">
    <div class="ins-loading">Loading&hellip;</div>
  </div>
</div>

<script>
var _B = 'https://raw.githubusercontent.com/arpitsantoki-afk/BDA-Website/main/';
var _INS = _B + '_data/insights/';
function imgU(s){ return s && s.startsWith('/') ? _B + s.slice(1) : s; }
function fmtD(d){
  if(!d) return '';
  var m=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var p=d.split('-'); return m[parseInt(p[1],10)-1]+' '+p[0];
}
function renderCard(post) {
  var url = '/insights/post.html?slug=' + encodeURIComponent(post.slug);
  return '<a href="'+url+'" class="ins-card">' +
    '<img class="ins-cover" src="'+imgU(post.cover_image)+'" alt="'+post.title+'" loading="lazy"/>' +
    '<div class="ins-card-body">' +
    '<div class="ins-meta">'+(post.category||'')+(post.date?' &middot; '+fmtD(post.date):'')+' </div>' +
    '<div class="ins-title">'+post.title+'</div>' +
    '<div class="ins-excerpt">'+(post.excerpt||'')+'</div>' +
    '<span class="ins-read">Read more &rarr;</span>' +
    '</div></a>';
}
fetch(_B + '_data/insights-index.json?t=' + Date.now())
  .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
  .then(function(idx){
    var slugs = idx.posts || [];
    if(!slugs.length){ document.getElementById('insights-grid').innerHTML='<div class="ins-loading">No posts yet.</div>'; return; }
    var posts=[], loaded=0;
    slugs.forEach(function(slug,i){
      fetch(_INS+slug+'.json?t='+Date.now())
        .then(function(r){ return r.json(); })
        .then(function(p){ p.slug=slug; posts[i]=p; loaded++; if(loaded===slugs.length) document.getElementById('insights-grid').innerHTML=posts.filter(Boolean).map(renderCard).join(''); })
        .catch(function(){ loaded++; });
    });
  })
  .catch(function(){ document.getElementById('insights-grid').innerHTML='<div class="ins-loading">No posts yet.</div>'; });
</script>
<div id="footer-slot"></div>
<script src="/components/nav-footer.js"></script>
</body>
</html>
