<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title id="page-title">Insights — Blue Door Architects</title>
<meta name="description" id="page-desc" content="Design thinking and project stories from Blue Door Architects."/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="icon" type="image/x-icon" href="/favicon.ico"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400&display=swap"/>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-LZEWCJRHDY"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-LZEWCJRHDY');gtag('config','AW-18244039331');</script>
<style>
:root{--gold:#c9a96e;--warm:#f5f0e8;--ink:#1a1a16;--mid:#6b6860;--ease:cubic-bezier(0.25,0.46,0.45,0.94)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--warm);color:var(--ink);font-family:'Jost',sans-serif;font-weight:300;min-height:100vh}
.post-page-body{padding-top:80px;min-height:80vh}
.post-hero{width:100%;aspect-ratio:21/9;object-fit:cover;display:block;background:#e8e3db}
.post-wrap{max-width:740px;margin:0 auto;padding:3.5rem 2rem 8rem}
.back-link{display:inline-flex;align-items:center;gap:0.5rem;font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--mid);text-decoration:none;margin-bottom:2.5rem;transition:color 0.2s}
.back-link:hover{color:var(--ink)}
.post-meta-line{font-size:0.68rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--mid);margin-bottom:1rem}
.post-h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(2rem,4.5vw,3.2rem);line-height:1.15;margin-bottom:1.25rem}
.post-excblock{font-size:0.92rem;line-height:1.85;color:var(--mid);border-left:2px solid var(--gold);padding-left:1.25rem;margin-bottom:2.5rem}
.post-divider{width:40px;height:0.5px;background:var(--gold);margin:2rem 0}
.post-body-wrap{font-size:0.9rem;line-height:1.95;color:var(--ink)}
.post-body-wrap p{margin-bottom:1.5rem}
.post-body-wrap h2{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:1.7rem;margin:2.5rem 0 1rem;line-height:1.2}
.post-cta-block{margin-top:4rem;padding:2.5rem;background:var(--ink);color:var(--warm)}
.post-cta-block .cta-h{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:1.6rem;margin-bottom:0.75rem}
.post-cta-block p{font-size:0.83rem;line-height:1.75;margin-bottom:1.5rem;opacity:0.75}
.post-cta-block a{display:inline-block;font-size:0.68rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink);background:var(--gold);padding:0.75rem 2rem;text-decoration:none;transition:opacity 0.2s}
.post-cta-block a:hover{opacity:0.85}
@media(max-width:768px){
  .post-hero{aspect-ratio:4/3}
  .post-wrap{padding:2.5rem 1.25rem 5rem}
}
</style>
</head>
<body>
<div class="post-page-body">
  <img class="post-hero" id="post-hero" src="" alt=""/>
  <div class="post-wrap">
    <a href="/insights/" class="back-link">&larr; All Insights</a>
    <div class="post-meta-line" id="post-meta"></div>
    <h1 class="post-h1" id="post-h1">Loading&hellip;</h1>
    <div class="post-excblock" id="post-exc"></div>
    <div class="post-divider"></div>
    <div class="post-body-wrap" id="post-body"></div>
    <div class="post-cta-block">
      <div class="cta-h">Start a conversation.</div>
      <p>Every project begins with a brief. If you are planning a new home, renovation or commercial space in Gandhinagar or Ahmedabad, we would like to hear about it.</p>
      <a href="/#contact">Begin a project &rarr;</a>
    </div>
  </div>
</div>

<script>
var _B = 'https://raw.githubusercontent.com/arpitsantoki-afk/BDA-Website/main/';
var _INS = _B + '_data/insights/';
function imgU(s){ return s && s.startsWith('/') ? _B + s.slice(1) : s; }
function fmtD(d){
  if(!d) return '';
  var m=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var p=d.split('-'); return m[parseInt(p[1],10)-1]+' '+p[0];
}
function renderBody(text){
  if(!text) return '';
  var lines = text.split('
');
  var html = '';
  lines.forEach(function(line){
    line = line.trim(); if(!line) return;
    if(line.startsWith('## ')) html += '<h2>'+line.slice(3)+'</h2>';
    else if(line.startsWith('# ')) html += '<h2>'+line.slice(2)+'</h2>';
    else html += '<p>'+line+'</p>';
  });
  return html;
}
var params = new URLSearchParams(window.location.search);
var slug = params.get('slug');
if(!slug){
  document.getElementById('post-h1').textContent = 'Post not found.';
} else {
  fetch(_INS + slug + '.json?t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(post){
      document.getElementById('page-title').textContent = post.title + ' — Blue Door Architects';
      document.getElementById('page-desc').setAttribute('content', post.excerpt || '');
      var hero = document.getElementById('post-hero');
      hero.src = imgU(post.cover_image); hero.alt = post.title;
      document.getElementById('post-meta').textContent = (post.category||'') + (post.date ? ' · ' + fmtD(post.date) : '') + (post.author ? ' · ' + post.author : '');
      document.getElementById('post-h1').textContent = post.title;
      document.getElementById('post-exc').textContent = post.excerpt || '';
      document.getElementById('post-body').innerHTML = renderBody(post.body);
    })
    .catch(function(){ document.getElementById('post-h1').textContent = 'Post not found.'; });
}
</script>
<script src="/components/nav-footer.js"></script>
</body>
</html>
