<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#131416"/>
<title>BDA Inquiries — Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#131416;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#1c1e21;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:48px 40px;width:100%;max-width:380px;text-align:center}
.logo{font-family:Georgia,serif;font-size:13px;letter-spacing:0.2em;color:#c9a96e;margin-bottom:6px}
.logo-sub{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.3);margin-bottom:40px}
.title{font-size:20px;font-weight:300;color:#e8e6e1;margin-bottom:8px}
.subtitle{font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:36px;line-height:1.6}
.btn-wrap{display:flex;justify-content:center;margin-bottom:16px}
.error{padding:12px;background:rgba(224,92,92,0.1);border:1px solid rgba(224,92,92,0.2);border-radius:6px;font-size:12px;color:#e07878;display:none;margin-bottom:12px;line-height:1.5}
.loading{font-size:12px;color:rgba(255,255,255,0.3);display:none;margin-bottom:12px}
.footer{margin-top:40px;font-size:10px;color:rgba(255,255,255,0.2);letter-spacing:0.1em}
</style>
</head>
<body>
<div class="card">
  <div class="logo">BLUE DOOR ARCHITECTS</div>
  <div class="logo-sub">Inquiries Dashboard</div>
  <div class="title">Welcome</div>
  <div class="subtitle">Sign in with your Google account<br>to access the dashboard.</div>
  <div class="error" id="error"></div>
  <div class="loading" id="loading">Verifying…</div>
  <div class="btn-wrap" id="g-btn-wrap"></div>
  <div class="footer">Blue Door Architects · Gandhinagar</div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
var API = 'https://inquiries.bluedoorarchitects.com';
var CLIENT_ID = '449634347678-tkbk083eu1igcil0rq58tgvdrs54l4nm.apps.googleusercontent.com';

// If already logged in, verify and redirect
var existing = localStorage.getItem('bda_inq_token');
if (existing) {
  fetch(API + '/auth/me', { headers: { 'X-Session-Token': existing } })
    .then(function(r){ return r.json(); })
    .then(function(d){ if (d.email) window.location.href = API + '/'; })
    .catch(function(){});
}

function showError(msg) {
  var el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('loading').style.display = 'none';
}

function handleCredential(response) {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('error').style.display = 'none';
  fetch(API + '/auth/google', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id_token: response.credential })
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    document.getElementById('loading').style.display = 'none';
    if (d.success) {
      localStorage.setItem('bda_inq_token', d.token);
      localStorage.setItem('bda_inq_user', JSON.stringify({ email: d.email, name: d.name, role: d.role }));
      window.location.href = API + '/';
    } else {
      showError(d.error || 'Login failed. You may not have access to this app.');
    }
  })
  .catch(function(){ showError('Connection error. Please try again.'); });
}

// Wait for Google GSI to load then render button
function initGoogle() {
  if (!window.google || !google.accounts) {
    setTimeout(initGoogle, 200);
    return;
  }
  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    callback: handleCredential,
    ux_mode: 'popup',
    auto_select: false
  });
  google.accounts.id.renderButton(
    document.getElementById('g-btn-wrap'),
    {
      type: 'standard',
      theme: 'outline',
      size: 'large',
      text: 'signin_with',
      shape: 'rectangular',
      width: 280
    }
  );
}

window.addEventListener('load', initGoogle);
</script>
</body>
</html>
