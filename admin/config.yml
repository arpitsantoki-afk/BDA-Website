# ================================================================
# DECAP CMS — Blue Door Architects
# GitHub OAuth via Cloudflare Worker
# ================================================================

backend:
  name: github
  repo: arpitsantoki-afk/BDA-Website
  branch: main
  base_url: https://cms-oauth.info-unikraft.workers.dev
  auth_endpoint: /

media_folder: "images/uploads"
public_folder: "/images/uploads"
# Note: Individual projects use their own subfolder: images/projects/{slug}/
# This keeps project images organized and makes the picker fast

collections:

  # ── PROJECTS INDEX ─────────────────────────────────────────
  - name: "projects_index"
    label: "Projects Index"
    files:
      - name: "index"
        label: "Project List (controls what appears on website)"
        file: "_data/projects-index.json"
        fields:
          - label: "Project Slugs"
            name: "projects"
            widget: "list"
            hint: "Add the slug of each project. The slug is the filename without .json (e.g. terra-calm-garg-residence)"
            field:
              label: "Project Slug"
              name: "slug"
              widget: "relation"
              collection: "projects"
              search_fields: ["name", "slug"]
              value_field: "{{slug}}"
              display_fields: ["name", "location"]

  # ── PROJECTS ───────────────────────────────────────────────
  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    folder: "_data/projects"
    create: true
    slug: "{{slug}}"
    format: "json"
    extension: "json"
    identifier_field: name
    fields:
      - { label: "Project Name", name: "name", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Residential", "Commercial", "Hospitality", "Landscape", "Mixed-Use", "Cultural", "Interior","Architectural & Landscape"]
      - { label: "Location", name: "location", widget: "string", hint: "e.g. Gandhinagar, India" }
      - { label: "Year", name: "year", widget: "string" }
      - { label: "Cover Image", name: "cover_image", widget: "image" }
      - { label: "Short Description", name: "description", widget: "text", required: false }
      - label: "Project Images (Gallery)"
        name: "images"
        widget: "list"
        required: false
        hint: "Upload images directly here — they go into this project's own folder. Add all images for this project's gallery popup. Select from uploaded media."
        field: { label: "Image", name: "image", widget: "image" }
      - { label: "Featured on Homepage", name: "featured", widget: "boolean", default: true }
      - { label: "Display Order", name: "order", widget: "number", default: 1, hint: "Lower = shown first" }

  # ── PROJECTS (legacy .md files) ────────────────────────────
  - name: "projects_md"
    label: "Projects (legacy)"
    label_singular: "Project"
    folder: "_data/projects"
    create: false
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    identifier_field: name
    fields:
      - { label: "Project Name", name: "name", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Residential", "Commercial", "Hospitality", "Mixed-Use", "Cultural", "Interior"]
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Year", name: "year", widget: "string" }
      - { label: "Cover Image", name: "cover_image", widget: "image" }
      - { label: "Short Description", name: "description", widget: "text", required: false }
      - { label: "Featured on Homepage", name: "featured", widget: "boolean", default: true }
      - { label: "Display Order", name: "order", widget: "number", default: 1 }

  # ── HERO SECTION ───────────────────────────────────────────
  - name: "hero"
    label: "Hero Section"
    files:
      - name: "hero_content"
        label: "Hero Content"
        file: "_data/hero.json"
        fields:
          - { label: "Hero Image", name: "hero_image", widget: "image" }
          - { label: "Headline Line 1", name: "line1", widget: "string" }
          - { label: "Headline Line 2", name: "line2", widget: "string" }
          - { label: "Headline Line 3 (italic gold)", name: "line3", widget: "string" }
          - { label: "Subtext", name: "subtext", widget: "text" }
          - { label: "Projects Count", name: "count_projects", widget: "string" }
          - { label: "Years Count", name: "count_years", widget: "string" }

  # ── SITE SETTINGS ──────────────────────────────────────────
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "general"
        label: "General Info"
        file: "_data/settings.json"
        fields:
          # ── CONTACT ──────────────────────────────────────
          - { label: "Studio Name", name: "studio_name", widget: "string", hint: "Appears in footer and page titles" }
          - { label: "Tagline", name: "tagline", widget: "string", hint: "e.g. Architecture & Turnkey Design" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Studio Location", name: "location", widget: "string", hint: "e.g. Gandhinagar, India" }
          - { label: "Address (optional)", name: "address", widget: "string", required: false }
          # ── SOCIAL ───────────────────────────────────────
          - { label: "Instagram URL", name: "instagram", widget: "string" }
          - { label: "Pinterest URL", name: "pinterest", widget: "string", required: false }
          # ── HERO SECTION ─────────────────────────────────
          - { label: "Hero Headline", name: "hero_headline", widget: "string", hint: "Main headline on homepage", required: false }
          - { label: "Hero Subtext", name: "hero_subtext", widget: "string", hint: "Small label above headline e.g. Architecture & Turnkey Design", required: false }
          - { label: "Projects Count", name: "stat_projects", widget: "string", hint: "e.g. 120+", required: false }
          - { label: "Years Count", name: "stat_years", widget: "string", hint: "e.g. 15+", required: false }
          - { label: "Turnkey Label", name: "stat_turnkey", widget: "string", hint: "e.g. 100%", required: false }
          # ── ABOUT / INTRO ─────────────────────────────────
          - { label: "Intro Heading", name: "intro_heading", widget: "string", required: false, hint: "e.g. A studio that designs with conviction" }
          - { label: "Intro Body Para 1", name: "intro_body1", widget: "text", required: false }
          - { label: "Intro Body Para 2", name: "intro_body2", widget: "text", required: false }
          # ── THE PALM GROUP ────────────────────────────────
          - { label: "Palm Group Description", name: "palm_group_desc", widget: "text" }
          - { label: "Palm Group URL", name: "palm_group_url", widget: "string", required: false, hint: "e.g. https://www.thepalm.in/" }
          # ── SEO ──────────────────────────────────────────
          - { label: "Meta Description", name: "meta_description", widget: "text", required: false, hint: "For Google search results" }
          - { label: "Canonical URL", name: "canonical_url", widget: "string", required: false, hint: "e.g. https://www.bluedoorarchitects.com/" }
          # ── COPYRIGHT ────────────────────────────────────
          - { label: "Copyright Year", name: "copyright_year", widget: "string", required: false, hint: "e.g. 2025" }

  # ── TESTIMONIALS ───────────────────────────────────────────
  - name: "testimonials"
    label: "Testimonials"
    label_singular: "Testimonial"
    folder: "_data/testimonials"
    create: true
    slug: "{{slug}}"
    format: "json"
    extension: "json"
    identifier_field: client_name
    fields:
      - { label: "Client Name", name: "client_name", widget: "string" }
      - { label: "Client Role / Location", name: "client_role", widget: "string" }
      - { label: "Quote", name: "quote", widget: "text" }
      - { label: "Show on Website", name: "active", widget: "boolean", default: true }

  # ── UNIKRAFT ───────────────────────────────────────────────
  - name: "unikraft"
    label: "Unikraft Section"
    files:
      - name: "unikraft_content"
        label: "Unikraft Content"
        file: "_data/unikraft.json"
        fields:
          - { label: "Section Image", name: "image", widget: "image" }
          - { label: "Collection Name", name: "collection", widget: "string" }
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Body Text 1", name: "body1", widget: "text" }
          - { label: "Body Text 2", name: "body2", widget: "text" }

  # ── THE MANUFACTORY ────────────────────────────────────────
  - name: "production"
    label: "The Manufactory Section"
    files:
      - name: "production_content"
        label: "Manufactory Content"
        file: "_data/production.json"
        fields:
          - { label: "Section Image", name: "image", widget: "image" }
          - { label: "Facility Size", name: "size", widget: "string" }
          - { label: "Body Text 1", name: "body1", widget: "text" }
          - { label: "Body Text 2", name: "body2", widget: "text" }

  # ── PUBLICATIONS ───────────────────────────────────────────
  - name: "publications"
    label: "Publications"
    label_singular: "Publication"
    folder: "_data/publications"
    create: true
    slug: "{{slug}}"
    format: "json"
    extension: "json"
    identifier_field: title
    fields:
      - { label: "Article Title", name: "title", widget: "string" }
      - { label: "Publication Logo", name: "logo", widget: "image", required: false, hint: "Upload publication logo (PNG/SVG with transparent background works best)" }
      - { label: "Publication / Outlet", name: "outlet", widget: "string", hint: "e.g. Architect & Interiors India" }
      - { label: "Article URL", name: "url", widget: "string" }
      - { label: "Date", name: "date", widget: "string", hint: "e.g. December 2025" }
      - { label: "Show on Website", name: "active", widget: "boolean", default: true }
      - { label: "Display Order", name: "order", widget: "number", default: 1, hint: "Lower = shown first" }
