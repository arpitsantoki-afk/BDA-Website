<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex"/>
  <title>Blue Door Architects — Content Manager</title>
  <style>
    .bda-inq-injected {
      display:inline-flex !important;
      align-items:center !important;
      gap:6px !important;
      background:transparent !important;
      color:rgba(255,255,255,0.8) !important;
      font-size:14px !important;
      letter-spacing:0 !important;
      text-transform:none !important;
      padding:6px 12px !important;
      border-radius:4px !important;
      text-decoration:none !important;
      font-weight:400 !important;
      cursor:pointer !important;
      font-family:inherit !important;
      border:none !important;
      transition:color 0.15s !important;
    }
    .bda-inq-injected:hover {
      color:#fff !important;
      background:rgba(255,255,255,0.1) !important;
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    function injectBtn() {
      if (document.getElementById('bda-inq-link')) return true;
      var selectors = [
        'header nav',
        '[class*="AppHeaderContent"]',
        '[class*="AppHeader"] nav',
        '[class*="Header"] ul',
        'header ul',
        'header > div > div',
      ];
      for (var i = 0; i < selectors.length; i++) {
        var el = document.querySelector(selectors[i]);
        if (el) {
          var a = document.createElement('a');
          a.id = 'bda-inq-link';
          a.href = '/admin/inquiries.html';
          a.className = 'bda-inq-injected';
          a.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>Inquiries';
          var children = el.children;
          var mid = Math.floor(children.length / 2);
          el.insertBefore(a, children[mid] || null);
          return true;
        }
      }
      return false;
    }

    var observer = new MutationObserver(function() {
      if (injectBtn()) observer.disconnect();
    });
    observer.observe(document.body, { childList: true, subtree: true });
    [500, 1000, 2000, 4000].forEach(function(t) { setTimeout(injectBtn, t); });
  </script>
</body>
</html>
