<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex"/>
  <title>Blue Door Architects — Content Manager</title>
  <style>
    .bda-inq-injected {
      display:inline-flex !important;
      align-items:center !important;
      background:#c9a96e !important;
      color:#1b1c1e !important;
      font-size:11px !important;
      letter-spacing:0.1em !important;
      text-transform:uppercase !important;
      padding:6px 14px !important;
      border-radius:4px !important;
      text-decoration:none !important;
      font-weight:600 !important;
      margin:0 auto !important;
      cursor:pointer !important;
      font-family:inherit !important;
    }
    .bda-inq-injected:hover{ opacity:0.85 !important; }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Use MutationObserver to detect when Decap renders its header nav
    function injectBtn() {
      // Decap CMS header nav items are in a <nav> or header element
      // Try multiple selectors Decap uses
      var selectors = [
        'header nav',
        '[class*="AppHeaderContent"]',
        '[class*="AppHeader"] nav',
        '[class*="Header"] ul',
        'header ul',
        'header > div > div',
      ];
      for (var i = 0; i < selectors.length; i++) {
        var el = document.querySelector(selectors[i]);
        if (el && !document.getElementById('bda-inq-link')) {
          var a = document.createElement('a');
          a.id = 'bda-inq-link';
          a.href = '/admin/inquiries.html';
          a.className = 'bda-inq-injected';
          a.textContent = '📋 Inquiries';
          // Insert as middle child
          var children = el.children;
          var mid = Math.floor(children.length / 2);
          el.insertBefore(a, children[mid] || null);
          return true;
        }
      }
      return false;
    }

    var observer = new MutationObserver(function() {
      if (injectBtn()) observer.disconnect();
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Fallback timeouts
    [500, 1000, 2000, 4000].forEach(function(t) {
      setTimeout(injectBtn, t);
    });
  </script>
</body>
</html>
